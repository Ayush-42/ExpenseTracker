# Render Blueprint — deploy from https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
